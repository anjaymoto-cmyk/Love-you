<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>I LOVE YOU - Kontrol Tangan</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;background:#05050f;color:#7dffb0;font-family:system-ui,sans-serif;overflow:hidden}
canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none}
#video{position:fixed;left:8px;top:calc(env(safe-area-inset-top,0px) + 8px);width:110px;border-radius:8px;transform:scaleX(-1);opacity:.8;display:none}
#info{position:fixed;left:8px;bottom:calc(env(safe-area-inset-bottom,0px) + 8px);font-size:13px}
#start{position:fixed;inset:0;display:flex;flex-direction:column;gap:14px;align-items:center;justify-content:center;background:#05050f;text-align:center;padding:24px}
#start button{font-size:18px;padding:14px 28px;border:0;border-radius:12px;background:#00d4ff;color:#002}
#start p{max-width:320px;font-size:14px;line-height:1.5;color:#bcd}
</style>
</head>
<body>
<canvas id="c"></canvas>
<video id="video" playsinline muted></video>
<div id="info"></div>
<div id="start">
  <h2>I LOVE YOU ❤️</h2>
  <p>Kepal = tulisan · Telapak terbuka = meledak · Dua jari = hati · Cubit = besar/kecil</p>
  <button id="btn">Mulai Kamera</button>
  <p id="err"></p>
</div>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1646424915/hands.js"></script>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const video=document.getElementById('video'),info=document.getElementById('info');
let W,H,N=1800,pos,vel,textT,heartT,amb;
const AC=['#19d3ff','#ff6bd6','#ffffff','#ffd166','#9b8cff'];
let cx,cy,sc=1,tsc=1,tx,ty,mode='text',found=false;

function build(){
  W=cv.width=innerWidth;H=cv.height=innerHeight;
  if(cx===undefined){cx=tx=W/2;cy=ty=H/2}
  // titik teks
  const o=document.createElement('canvas'),oc=o.getContext('2d');
  o.width=W;o.height=Math.round(W*0.4);
  let fs=100;oc.font='bold '+fs+'px Arial';
  fs=fs*(W*0.88)/oc.measureText('I LOVE YOU').width;
  oc.font='bold '+fs+'px Arial';oc.fillStyle='#fff';oc.textAlign='center';oc.textBaseline='middle';
  oc.fillText('I LOVE YOU',W/2,o.height/2);
  const d=oc.getImageData(0,0,o.width,o.height).data,pts=[];
  const step=Math.max(3,Math.round(W/150));
  for(let y=0;y<o.height;y+=step)for(let x=0;x<o.width;x+=step)
    if(d[(y*o.width+x)*4]>128)pts.push([x-W/2,y-o.height/2]);
  textT=new Float32Array(N*2);heartT=new Float32Array(N*2);
  const hs=W*0.6/32;
  for(let i=0;i<N;i++){
    const p=pts[(Math.random()*pts.length)|0];
    textT[i*2]=p[0];textT[i*2+1]=p[1];
    const t=Math.random()*Math.PI*2;
    const r=Math.random()<.65?1:.3+Math.random()*.7;
    heartT[i*2]=16*Math.sin(t)**3*hs*r;
    heartT[i*2+1]=-(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t))*hs*r;
  }
  if(!pos){pos=new Float32Array(N*2);vel=new Float32Array(N*2);
    for(let i=0;i<N;i++){pos[i*2]=Math.random()*W;pos[i*2+1]=Math.random()*H}}
}
addEventListener('resize',build);build();

// sentuh/geser jari di layar juga menggerakkan (cadangan)
cv.addEventListener('pointermove',e=>{if(!found){tx=e.clientX;ty=e.clientY}});

function frame(){
  if(found){cx+=(tx-cx)*.15;cy+=(ty-cy)*.15;sc+=(tsc-sc)*.1}
  else{cx+=(tx-cx)*.15;cy+=(ty-cy)*.15;sc+=(1-sc)*.05}
  const m=found?mode:'text',T=m==='heart'?heartT:textT;
  for(let i=0;i<N;i++){
    const k=i*2;
    if(m==='scatter'){
      const dx=pos[k]-cx,dy=pos[k+1]-cy,dist=Math.hypot(dx,dy)+1e-3;
      vel[k]+=dx/dist*1.2+(Math.random()-.5)*1.2;
      vel[k+1]+=dy/dist*1.2+(Math.random()-.5)*1.2;
      vel[k]*=.95;vel[k+1]*=.95;
    }else{
      vel[k]+=(T[k]*sc+cx-pos[k])*.04;vel[k+1]+=(T[k+1]*sc+cy-pos[k+1])*.04;
      vel[k]*=.85;vel[k+1]*=.85;
    }
    pos[k]=Math.min(W-1,Math.max(0,pos[k]+vel[k]));
    pos[k+1]=Math.min(H-1,Math.max(0,pos[k+1]+vel[k+1]));
  }
  ctx.fillStyle='rgba(5,5,15,.35)';ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#19d3ff';
  for(let i=0;i<N;i++)ctx.fillRect(pos[i*2],pos[i*2+1],2.2,2.2);
  // partikel latar yang melayang pelan
  if(!amb){amb=[];for(let i=0;i<260;i++)amb.push({x:Math.random()*W,y:Math.random()*H,v:.2+Math.random()*.7,r:1+Math.random()*2.2,c:AC[(Math.random()*AC.length)|0],p:Math.random()*6.28,h:Math.random()<.12})}
  const tt=performance.now()/1000;
  for(const a of amb){
    a.y-=a.v;a.x+=Math.sin(tt+a.p)*.3;
    if(a.y<-10){a.y=H+10;a.x=Math.random()*W}
    ctx.globalAlpha=.35+.45*Math.abs(Math.sin(tt*1.5+a.p));
    ctx.fillStyle=a.c;
    if(a.h){ctx.font=(a.r*6+6)+'px sans-serif';ctx.fillText('\u2764',a.x,a.y)}else ctx.fillRect(a.x,a.y,a.r,a.r);
  }
  ctx.globalAlpha=1;
  info.textContent='Mode: '+m+' | Tangan: '+(found?'ya':'tidak');
  requestAnimationFrame(frame);
}

function onResults(r){
  if(r.multiHandLandmarks&&r.multiHandLandmarks.length){
    const lm=r.multiHandLandmarks[0];found=true;
    tx=(1-lm[9].x)*W;ty=lm[9].y*H;   // dicerminkan
    const up=[[8,6],[12,10],[16,14],[20,18]].map(p=>lm[p[0]].y<lm[p[1]].y);
    const n=up.filter(Boolean).length;
    if(up[0]&&up[1]&&!up[2]&&!up[3])mode='heart';
    else if(n>=4)mode='scatter';
    else if(n===0)mode='text';
    const d=Math.hypot(lm[4].x-lm[8].x,lm[4].y-lm[8].y);
    tsc=Math.max(.6,Math.min(1.8,.6+d*5));
  }else found=false;
}

document.getElementById('btn').onclick=async()=>{
  const err=document.getElementById('err');
  try{
    const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:640,height:480},audio:false});
    video.srcObject=stream;await video.play();video.style.display='block';
    const hands=new Hands({locateFile:f=>'https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1646424915/'+f});
    hands.setOptions({maxNumHands:1,modelComplexity:0,minDetectionConfidence:.6,minTrackingConfidence:.6});
    hands.onResults(onResults);
    document.getElementById('start').style.display='none';
    let busy=false;
    (async function loop(){
      if(!busy&&video.readyState>=2){busy=true;await hands.send({image:video});busy=false}
      requestAnimationFrame(loop);
    })();
    frame();
  }catch(e){
    err.textContent='Kamera/model gagal dimuat: '+e.message+'. Tanpa kamera, kamu tetap bisa geser jari di layar.';
    document.getElementById('btn').textContent='Lanjut tanpa kamera';
    document.getElementById('btn').onclick=()=>{document.getElementById('start').style.display='none';frame()};
  }
};
</script>
</body>
</html>
